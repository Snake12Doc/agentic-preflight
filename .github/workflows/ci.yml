name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Git Flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branches
        id: route
        shell: bash
        run: |
          printf 'Pull request: %s -> %s\n' "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF"
          case "$GITHUB_BASE_REF:$GITHUB_HEAD_REF" in
            develop:feature/?*|develop:release/?*|develop:hotfix/?*|develop:main|main:release/?*|main:hotfix/?*)
              printf 'Valid Git Flow pull request.\n'
              ;;
            *)
              printf '::error::Invalid pull request route. See CONTRIBUTING.md for supported Git Flow routes.\n'
              exit 1
              ;;
          esac

  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  spring-boot-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/spring-boot-demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode verify
